# Change Data Capture stack — Debezium Connect + connector registration
#
# Run AFTER infra and apps are healthy:
#   docker compose -f docker-compose.cdc.yml up -d
#
# The claims table must exist before the connector is registered (created by
# Liquibase when claims-service starts). Running this compose after start-app.sh
# guarantees the table is present.
#
# Also set app.events.cdc-enabled=true in claims-service to disable the direct
# Kafka fallback and rely solely on CDC events.

services:

  debezium:
    image: debezium/connect:2.4
    container_name: demo-debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      DEBEZIUM_PASSWORD: debezium_pass
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  debezium-init:
    image: curlimages/curl:8.5.0
    container_name: demo-debezium-init
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./docker/compose/debezium/register-connectors.sh:/scripts/register-connectors.sh:ro
      - ./docker/compose/debezium/connector-configs:/scripts/connector-configs:ro
    command: ["sh", "/scripts/register-connectors.sh", "debezium:8083"]
    networks:
      - demo-network
    restart: "no"

networks:
  demo-network:
    external: true
    name: demo-network
