spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///demo_app
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  kafka:
    bootstrap-servers: localhost:29092
  redis:
    host: localhost
    port: 6379

logging:
  level:
    com.example.demo: INFO
    org.springframework: INFO
    org.testcontainers: INFO
